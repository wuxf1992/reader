services:
  reader:
    image: reader-github:plugin-js-runtime-875fec84
    pull_policy: never
    container_name: reader
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    ports:
      - 127.0.0.1:4396:5888
    extra_hosts:
      - reader-browser:127.0.0.1
    volumes:
      - ./data-main:/data
      - ./books:/books
      - ./web-offline:/app/web:ro
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    mem_limit: 3g
    cpus: 2.0
    environment:
      LOG_LEVEL: info
      NODE_OPTIONS: --max-old-space-size=1024
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
